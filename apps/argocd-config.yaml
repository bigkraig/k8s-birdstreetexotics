# Argo CD manages ITSELF: the pinned upstream install + this tenant's config (manifests/argocd-config).
# NO resources-finalizer on purpose — deleting/pruning this app must never cascade-delete Argo.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-config
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:bigkraig/k8s-birdstreetexotics.git
    targetRevision: main
    path: manifests/argocd-config
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true   # ApplicationSet CRD exceeds the client-side-apply annotation limit
