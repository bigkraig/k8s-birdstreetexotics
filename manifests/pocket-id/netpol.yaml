# Intra-tenant traffic is default-deny (platform policy); vcluster syncs this to the host.
# Only Pocket ID itself — and the one-off SQLite→Postgres import job (app=pocket-id-migrate, remove
# after the migration) — may reach its database.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pocket-id-db-from-pocket-id
  namespace: pocket-id
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: pocket-id-db
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: app, operator: In, values: [pocket-id, pocket-id-migrate] }
      ports:
        - { protocol: TCP, port: 5432 }
