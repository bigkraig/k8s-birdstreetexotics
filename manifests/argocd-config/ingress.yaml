# Exposure: argocd.birdstreetexotics.com behind the forward-auth gate; Traefik terminates TLS.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.priority: "1000"
    traefik.ingress.kubernetes.io/router.middlewares: kube-system-oauth-auth-birdstreetexotics@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: argocd.birdstreetexotics.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 80
