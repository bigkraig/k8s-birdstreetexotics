# Argo CD manages ITSELF from here (app argocd-config): the upstream install pinned to a release,
# plus this tenant's config layered on top. Upgrading Argo = bump the version in the URL below.
#  - ConfigMaps are PATCHES over upstream's (upstream ships argocd-cm/-cmd-params-cm/-rbac-cm),
#    so upstream defaults and our keys live in one object with one owner.
#  - Argo's bundled NetworkPolicies are deleted (they break intra-Argo traffic in this vcluster —
#    see ultra-piggy CLAUDE.md).
#  - Needs ServerSideApply (the ApplicationSet CRD is too big for client-side apply's annotation).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.4.13/manifests/install.yaml
  - ingress.yaml
patches:
  - path: cmd-params-patch.yaml
  - path: netpol-deletes.yaml
# Newer than upstream's pins: Argo's install.yaml lags on these (3.4.13 still ships dex 2.45.0 /
# redis 8.2.3, which carry critical CVEs). Drop an override once upstream catches up.
images:
  - name: ghcr.io/dexidp/dex
    newTag: v2.46.1
  - name: public.ecr.aws/docker/library/redis
    newTag: 8.2.11-alpine
